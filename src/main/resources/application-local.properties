# ==============================================================================
# Local Profile Configuration
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api/dms}

# Config Server (Optional for local development)
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}/nnp-config

# Git Repository Credentials & URL
git.repository.url=${GIT_REPOSITORY_URL:https://gitlab.example.com/bigdata-management/deployment/dms-deploy-script.git}
git.repository.branch=${GIT_REPOSITORY_BRANCH:main}
git.repository.username=${GIT_REPOSITORY_USERNAME:devops}
git.repository.token=${GIT_REPOSITORY_TOKEN:}

# Local PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nnp-core-comp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_DEFAULT_SCHEMA:portal}

# DMS Operational Parameters
deployment.health.port=${DEPLOYMENT_HEALTH_PORT:9099}
deployment.disk.threshold=${DEPLOYMENT_DISK_THRESHOLD:80}
deployment.scheduler.cron=${DEPLOYMENT_SCHEDULER_CRON:0 */5 * * * *}
dms.ssh-key.ttl-minutes=${DMS_SSH_KEY_TTL_MINUTES:60}
dms.ssh-key.purge-delay-ms=${DMS_SSH_KEY_PURGE_DELAY_MS:60000}
dms.ssh.connect-timeout-ms=${DMS_SSH_CONNECT_TIMEOUT_MS:10000}

# Local Logging
logging.level.com.nnp.dms=DEBUG
logging.level.org.springframework.web=INFO
