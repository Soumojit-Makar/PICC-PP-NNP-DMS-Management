# ==============================================================================
# PICC-PP-NNP-DMS-Management - Application Configuration
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api/dms}
spring.application.name=dms-management-service

# Active Profile (Override via SPRING_PROFILES_ACTIVE=dev | main | local)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Spring Cloud Config Label
spring.cloud.config.label=${CONFIG_LABEL:v1}

# Optional Centralized Spring Cloud Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}/nnp-config

# ------------------------------------------------------------------------------
# Git Repository Configuration (DMS Deployment Scripts)
# ------------------------------------------------------------------------------
git.repository.url=${GIT_REPOSITORY_URL:https://gitlab.example.com/bigdata-management/deployment/dms-deploy-script.git}
git.repository.branch=${GIT_REPOSITORY_BRANCH:main}
git.repository.username=${GIT_REPOSITORY_USERNAME:devops}
git.repository.token=${GIT_REPOSITORY_TOKEN:}

# ------------------------------------------------------------------------------
# Database / JPA Configuration (PostgreSQL)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nnp-core-comp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_DEFAULT_SCHEMA:portal}

# ------------------------------------------------------------------------------
# DMS Lifecycle & SSH Configuration
# ------------------------------------------------------------------------------
deployment.health.port=${DEPLOYMENT_HEALTH_PORT:9099}
deployment.disk.threshold=${DEPLOYMENT_DISK_THRESHOLD:80}
deployment.scheduler.cron=${DEPLOYMENT_SCHEDULER_CRON:0 */5 * * * *}
dms.ssh-key.ttl-minutes=${DMS_SSH_KEY_TTL_MINUTES:60}
dms.ssh-key.purge-delay-ms=${DMS_SSH_KEY_PURGE_DELAY_MS:60000}
dms.ssh.connect-timeout-ms=${DMS_SSH_CONNECT_TIMEOUT_MS:10000}

# ------------------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true

# ------------------------------------------------------------------------------
# Actuator & Observability
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.env.show-values=NEVER
management.endpoint.configprops.show-values=NEVER

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.nnp.dms=${LOG_LEVEL:INFO}
